<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Portal Académico</title>

  <!-- Vinculación con la hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Enlace de accesibilidad: permite saltar al contenido con el teclado -->
  <a class="skip-link" href="#login-form">Saltar al formulario</a>

  <main class="page">

    <!-- Panel decorativo (solo visible en pantallas medianas y grandes) -->
    <aside class="brand-panel" aria-hidden="true">
      <div class="brand-content">
        <div class="brand-logo">
          <!-- Icono de escudo (seguridad) -->
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h2>Bienvenido de nuevo</h2>
        <p>Accede a tu cuenta de forma rápida y segura para continuar con tus actividades.</p>
      </div>
    </aside>

    <!-- Tarjeta con el formulario -->
    <section class="card" aria-labelledby="titulo-login">
      <header class="card-header">
        <div class="avatar" aria-hidden="true">
          <!-- Icono de usuario -->
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <h1 id="titulo-login">Iniciar sesión</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>
      </header>

      <!-- novalidate: desactiva la validación nativa para usar la nuestra en JavaScript -->
      <form id="login-form" novalidate>

        <!-- Campo: correo electrónico -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="tucorreo@ejemplo.com"
              autocomplete="email"
              aria-describedby="email-error"
              aria-invalid="false"
              required
            />
          </div>
          <!-- role="alert": los lectores de pantalla anuncian el error al aparecer -->
          <p class="error-message" id="email-error" role="alert"></p>
        </div>

        <!-- Campo: contraseña -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="icon-left" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 018 0v3"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="current-password"
              aria-describedby="password-error"
              aria-invalid="false"
              required
            />
            <!-- Botón para mostrar/ocultar la contraseña -->
            <button type="button" class="toggle-password" id="toggle-password"
                    aria-label="Mostrar contraseña" aria-pressed="false">
              <!-- Ojo abierto -->
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Ojo tachado -->
              <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.1A10.7 10.7 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.2"/>
                <path d="M6.6 6.6A17 17 0 002 12s3.5 7 10 7a10 10 0 004.4-1"/>
                <path d="M9.9 9.9a3 3 0 004.2 4.2"/>
              </svg>
            </button>
          </div>
          <p class="error-message" id="password-error" role="alert"></p>
        </div>

        <!-- Opciones: recordar correo y recuperar contraseña -->
        <div class="options">
          <label class="checkbox" for="remember">
            <input type="checkbox" id="remember" name="remember" />
            <span class="checkmark" aria-hidden="true"></span>
            <span>Recordar mi correo</span>
          </label>
          <a href="#" class="link" id="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón principal -->
        <button type="submit" class="btn-primary" id="submit-btn">Iniciar sesión</button>

        <!-- Zona de mensajes generales (éxito o error de credenciales) -->
        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
      </form>

      <footer class="card-footer">
        <p>Proyecto educativo - Login desarrollado en VS Code.</p>
      </footer>
    </section>
  </main>

  <!-- Vinculación con el archivo JavaScript (al final para que el DOM ya exista) -->
  <script src="script.js"></script>
</body>
</html>
